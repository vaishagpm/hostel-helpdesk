<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Hostel Help Desk{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="page {% block page_class %}{% endblock %}">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash flash-{{ category }}" role="alert">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>

  <nav class="tabs" aria-label="Main">
    <a href="{{ url_for('report') }}" class="{{ 'active' if request.endpoint == 'report' }}">Report</a>
    <a href="{{ url_for('my_requests') }}" class="{{ 'active' if request.endpoint == 'my_requests' }}">My requests</a>
    <a href="{{ url_for('staff') }}" class="{{ 'active' if request.endpoint == 'staff' }}">Staff</a>
  </nav>
</body>
</html>
